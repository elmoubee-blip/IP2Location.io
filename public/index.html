<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GeoLens - IP Intelligence</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background:
    radial-gradient(circle at top, #12345a 0%, #081426 45%, #050b14 100%);
  color: #fff;
  min-height: 100vh;
}

.container {
  width: 100%;
  max-width: 900px;
  margin: auto;
  padding: 35px 18px 50px;
}

header {
  text-align: center;
  margin-bottom: 30px;
}

.logo {
  font-size: 42px;
  font-weight: 800;
  letter-spacing: 1px;
}

.subtitle {
  color: #9fb1c9;
  font-size: 17px;
  margin-top: 8px;
}

.card {
  background: rgba(25, 43, 67, 0.82);
  border: 1px solid rgba(130, 170, 210, 0.25);
  border-radius: 28px;
  padding: 28px;
  box-shadow: 0 20px 60px rgba(0,0,0,.35);
  backdrop-filter: blur(12px);
}

.search-box {
  display: flex;
  gap: 12px;
}

input {
  flex: 1;
  padding: 19px;
  border-radius: 18px;
  border: 1px solid #3d536e;
  background: #081323;
  color: white;
  font-size: 18px;
  outline: none;
}

input:focus {
  border-color: #19bfff;
}

button {
  border: none;
  border-radius: 18px;
  padding: 0 28px;
  background: linear-gradient(135deg, #00c6ff, #4169ff);
  color: white;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  min-height: 58px;
}

button:active {
  transform: scale(.98);
}

.example {
  color: #8195b0;
  margin: 16px 2px 30px;
}

.status {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
}

.status h2 {
  margin: 0;
}

.badge {
  background: rgba(0, 220, 150, .15);
  color: #45e7a6;
  padding: 10px 15px;
  border-radius: 30px;
  font-weight: bold;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
}

.info {
  background: rgba(255,255,255,.055);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 20px;
  padding: 20px;
  min-height: 100px;
}

.label {
  color: #8ea2bd;
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 10px;
}

.value {
  font-size: 19px;
  font-weight: bold;
  word-break: break-word;
}

.map {
  margin-top: 18px;
  border-radius: 20px;
  overflow: hidden;
  display: none;
}

.map iframe {
  width: 100%;
  height: 280px;
  border: 0;
}

.loading {
  text-align: center;
  color: #9db0c8;
  padding: 25px;
}

.error {
  background: rgba(255,70,70,.12);
  color: #ff8585;
  padding: 15px;
  border-radius: 15px;
  margin-top: 20px;
  display: none;
}

.footer {
  text-align: center;
  color: #657a95;
  margin-top: 25px;
  font-size: 13px;
}

@media (max-width: 650px) {
  .container {
    padding: 25px 14px;
  }

  .logo {
    font-size: 36px;
  }

  .card {
    padding: 20px;
    border-radius: 24px;
  }

  .search-box {
    flex-direction: column;
  }

  button {
    width: 100%;
  }

  .grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>
